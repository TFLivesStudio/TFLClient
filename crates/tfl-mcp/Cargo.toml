[package]
name = "tfl-mcp"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "tflclient-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
