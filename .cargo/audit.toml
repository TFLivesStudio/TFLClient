# Configuración de `cargo audit` (se ejecuta en .github/workflows/ci.yml).
#
# Política: una VULNERABILIDAD (advisory sin "Warning:") rompe el CI y se
# arregla con `cargo update -p <crate>`. Los ids de abajo son avisos de
# "unmaintained" / "unsound" de dependencias TRANSITIVAS de Tauri/GTK/etc. que
# no podemos arreglar desde acá (hay que esperar a que el crate de arriba
# migre). Cargo-audit ya los trata como advertencias que no cortan el CI; los
# listamos explícitos para que el ruido no tape un aviso nuevo y para dejar
# registrado por qué no se tocan. REVISAR esta lista cada vez que se actualice
# Tauri (`cargo update -p tauri`): con suerte la mayoría desaparece.
#
# Triage hecho el 2026-10-07 contra el Cargo.lock del repo.
[advisories]
ignore = [
	# glib 0.18.5 — unsound (VariantStrIter). Lo trae gtk 0.18 <- libappindicator
	# <- tray-icon <- tauri (Linux). Solución real: gtk-rs >= 0.20, que depende de
	# que Tauri/wry/tao migren; no lo controlamos nosotros.
	"RUSTSEC-2024-0429",

	# proc-macro-error 1.0.4 — unmaintained. Solo en tiempo de compilación, lo trae
	# glib-macros 0.18 (misma cadena gtk-rs de arriba). Sin código en runtime.
	"RUSTSEC-2024-0370",

	# atomic-polyfill 1.0.3 — unmaintained. Lo trae heapless 0.7 <- postcard 1.1
	# (usado por el crate `ablage` y por la app). Se arregla cuando postcard
	# actualice heapless; no hay versión de postcard 1.x que lo evite.
	"RUSTSEC-2023-0089",

	# Familia `unic-*` 0.9 — unmaintained (5 avisos). Todos vienen por
	# urlpattern 0.3 <- tauri-utils (dependencia de build de Tauri). Es código de
	# compilación/parseo de config, no se ejecuta con datos del usuario.
	"RUSTSEC-2025-0081", # unic-char-property
	"RUSTSEC-2025-0075", # unic-char-range
	"RUSTSEC-2025-0080", # unic-common
	"RUSTSEC-2025-0100", # unic-ucd-ident
	"RUSTSEC-2025-0098", # unic-ucd-version

	# zip 4.6.1 — 3 vulnerabilidades reales (symlink traversal/SUID, una
	# crítica). SOLO en Windows: tauri-plugin-updater 2.11.0 fija
	# `zip = "4"` como dependencia de plataforma Windows para su feature
	# "zip" (prendida por default), que usamos para el instalador NSIS.
	# El propio `cargo update -p zip` de más arriba de este archivo ya
	# actualizó la `zip` que usamos directo (src-tauri, aqua, launchwerk,
	# zellkern, cubrinth) a 9.0.5 — esto es la de tauri-plugin-updater, no
	# la nuestra. No hay versión 2.x de tauri-plugin-updater con zip
	# actualizado todavía (solo existe 3.0.0-alpha, no apto para producción
	# hoy); apagar la feature "zip" arriesgaría romper el updater en
	# Windows sin poder probarlo. Las tres vienen del mismo zip@4.6.1,
	# revisar junto con `cargo update -p tauri-plugin-updater`.
	"RUSTSEC-2026-0367",
	"RUSTSEC-2026-0368",
	"RUSTSEC-2026-0369",

	# zbus_names / zvariant / zvariant_derive — unmaintained (3 avisos, no
	# vulnerabilidades). Vienen de zbus 5.19 (soporte D-Bus de Linux),
	# traído por tauri-plugin-opener y tauri-plugin-single-instance — no
	# algo que controlemos desde acá.
	"RUSTSEC-2026-0370", # zvariant
	"RUSTSEC-2026-0371", # zbus_names
	"RUSTSEC-2026-0372", # zvariant_derive
]
