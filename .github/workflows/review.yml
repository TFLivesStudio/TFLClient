name: Review installers (no release)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  installers:
    needs: quality
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev xdg-utils
      - uses: ./.github/actions/setup-rust
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Build review installer
        run: bunx tauri build --profile review --config src-tauri/tauri.review.conf.json
      - name: Upload manual review installers (not updater artifacts)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-${{ matrix.platform }}
          path: |
            target/review/bundle/nsis/*.exe
            target/review/bundle/msi/*.msi
            target/review/bundle/deb/*.deb
            target/review/bundle/rpm/*.rpm
            target/review/bundle/appimage/*.AppImage
            target/review/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
