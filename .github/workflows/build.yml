name: Recover signed TFL Client 0.15.4

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: recover-stable-v0.15.4
  cancel-in-progress: false

jobs:
  stable-draft:
    name: Verify and stage stable release
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    env:
      RELEASE_TAG: v0.15.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: c2f6814850875906cde833f380f25db6d5e64c49
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stable-*
          path: stable-matrix
          run-id: 44381610229
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stable-ubuntu-22.04
          path: stable-matrix/stable-ubuntu-22.04
          run-id: 44435866728
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-updater-probe
          path: updater-probe
          run-id: 44381610229
          github-token: ${{ github.token }}
      - name: Install signature verifier and native smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xauth xdotool rpm
      - name: Verify recovered Linux packages
        shell: bash
        run: |
          set -euxo pipefail
          root="$PWD/stable-matrix/stable-ubuntu-22.04"
          appimage=("$root"/*.AppImage)
          deb=("$root"/*.deb)
          rpm=("$root"/*.rpm)
          version="${RELEASE_TAG#v}"
          test "${#appimage[@]}" -eq 1 && test -s "${appimage[0]}"
          test "${#deb[@]}" -eq 1 && test -s "${deb[0]}"
          test "${#rpm[@]}" -eq 1 && test -s "${rpm[0]}"
          deb_version="$(dpkg-deb --field "${deb[0]}" Version)"
          dpkg --compare-versions "$deb_version" eq "$version"
          dpkg-deb --extract "${deb[0]}" "$RUNNER_TEMP/tfl-deb-smoke"
          test -x "$RUNNER_TEMP/tfl-deb-smoke/usr/bin/tflclient"
          test "$(rpm -qp --queryformat '%{VERSION}' "${rpm[0]}")" = "$version"
          rpm -qpl "${rpm[0]}" > "$RUNNER_TEMP/tfl-rpm-files.txt"
          grep -E '^(/|\./)?usr/bin/tflclient$' "$RUNNER_TEMP/tfl-rpm-files.txt"
          mkdir "$RUNNER_TEMP/tfl-appimage-smoke"
          cd "$RUNNER_TEMP/tfl-appimage-smoke"
          chmod +x "${appimage[0]}"
          "${appimage[0]}" --appimage-extract > extract.log
          test -x squashfs-root/AppRun
      - name: Verify updater signatures and generate a complete release manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-version.mjs --check --tag "$RELEASE_TAG"
          node scripts/release-notes-body.mjs "$RELEASE_TAG" > release-notes.md
          mkdir release-assets
          python3 <<'PY'
          import base64
          import datetime
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          matrix = Path("stable-matrix")
          assets = Path("release-assets")
          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["GITHUB_REPOSITORY"]
          config = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          public_key = Path("updater.pub")
          public_key.write_bytes(base64.b64decode(config["plugins"]["updater"]["pubkey"], validate=True))
          platforms = {}

          def unique(platform, pattern):
              candidates = list((matrix / ("stable-" + platform)).glob(pattern))
              if len(candidates) != 1 or candidates[0].stat().st_size == 0:
                  raise ValueError(f"{platform} must contain exactly one nonempty {pattern}")
              return candidates[0]

          def keep(source, alias=None):
              destination = assets / (alias or source.name)
              if destination.exists():
                  raise ValueError(f"Duplicate release asset {destination.name}")
              shutil.copyfile(source, destination)

          windows = unique("windows-latest", "*-setup.exe")
          macos = unique("macos-latest", "*.app.tar.gz")
          linux = unique("ubuntu-22.04", "*.AppImage")
          dmg = unique("macos-latest", "*.dmg")
          deb = unique("ubuntu-22.04", "*.deb")
          rpm = unique("ubuntu-22.04", "*.rpm")

          for source, alias in [
              (windows, "TFLClient-Windows-Setup.exe"), (dmg, "TFLClient-macOS.dmg"),
              (linux, "TFLClient-Linux.AppImage"), (deb, "TFLClient-Linux.deb"),
              (rpm, "TFLClient-Linux.rpm"),
          ]:
              keep(source, alias)
          updater_targets = {
              windows: ("windows-x86_64", "nsis", True),
              macos: ("darwin-aarch64", "app", True),
              linux: ("linux-x86_64", "appimage", True),
              deb: ("linux-x86_64", "deb", False),
              rpm: ("linux-x86_64", "rpm", False),
          }
          for source in (*updater_targets, dmg):
              keep(source)
              signature = source.with_name(source.name + ".sig")
              if source in updater_targets or signature.is_file():
                  encoded = signature.read_text(encoding="utf-8").strip()
                  decoded = Path("updater.minisig")
                  decoded.write_bytes(base64.b64decode(encoded, validate=True))
                  subprocess.run(["minisign", "-Vm", str(source), "-p", str(public_key),
                                  "-x", str(decoded)], check=True)
                  keep(signature)
                  if source in updater_targets:
                      platform, bundle, default = updater_targets[source]
                      entry = {"signature": encoded, "url": (
                          f"https://github.com/{repository}/releases/download/{quote(tag)}/{quote(source.name)}"
                      )}
                      platforms[f"{platform}-{bundle}"] = entry
                      if default:
                          platforms[platform] = entry

          manifest = {
              "version": tag.removeprefix("v"),
              "notes": Path("release-notes.md").read_text(encoding="utf-8").strip(),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": platforms,
          }
          Path("release-assets/latest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          (cd release-assets && sha256sum -- * > SHA256SUMS)
      - name: Upgrade a published AppImage with the native Tauri updater
        shell: bash
        run: |
          set -euo pipefail
          export SMOKE_ROOT="$RUNNER_TEMP/tfl-updater-smoke"
          mkdir -p "$SMOKE_ROOT/mirror" "$SMOKE_ROOT/profile" release-evidence
          chmod +x updater-probe/updater_smoke
          touch "$SMOKE_ROOT/profile/TEST_PROFILE"
          release_base="https://github.com/$GITHUB_REPOSITORY/releases"
          baseline_manifest="$release_base/latest/download/latest.json"
          if [[ "$RELEASE_TAG" == v0.15.4 ]]; then
            baseline_manifest="$release_base/download/v0.15.4-beta.3/latest.json"
          fi
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            "$baseline_manifest" -o "$SMOKE_ROOT/baseline.json"
          baseline_url="$(jq -er '.platforms["linux-x86_64"].url' "$SMOKE_ROOT/baseline.json")"
          [[ "$baseline_url" == "$release_base/download/"*".AppImage" ]]
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            "$baseline_url" -o "$SMOKE_ROOT/mirror/baseline.AppImage"
          cp "$SMOKE_ROOT/mirror/baseline.AppImage" "$SMOKE_ROOT/profile/installed.AppImage"
          chmod +x "$SMOKE_ROOT/profile/installed.AppImage"
          xvfb-run -a python3 -u - <<'PY' | tee release-evidence/updater.txt
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from threading import Thread
          from urllib.parse import unquote, urlsplit
          import hashlib
          import json
          import os
          import shutil
          import subprocess

          root = Path(os.environ["SMOKE_ROOT"])
          profile = root / "profile"
          mirror = root / "mirror"
          installed = profile / "installed.AppImage"
          assets = Path("release-assets")
          current = json.loads((root / "baseline.json").read_text(encoding="utf-8"))
          candidate = json.loads((assets / "latest.json").read_text(encoding="utf-8"))
          platform = "linux-x86_64"
          asset = unquote(urlsplit(candidate["platforms"][platform]["url"]).path.rsplit("/", 1)[-1])
          shutil.copyfile(assets / asset, mirror / "candidate.AppImage")
          shutil.copyfile(assets / asset, mirror / "tampered.AppImage")
          with (mirror / "tampered.AppImage").open("ab") as modified:
              modified.write(b"modified by the smoke test\n")

          def digest(path):
              with path.open("rb") as data:
                  return hashlib.file_digest(data, "sha256").hexdigest()

          handler = partial(SimpleHTTPRequestHandler, directory=mirror)
          with ThreadingHTTPServer(("127.0.0.1", 0), handler) as server:
              thread = Thread(target=server.serve_forever, daemon=True)
              thread.start()
              base = f"http://127.0.0.1:{server.server_port}"

              def probe(mode, manifest, binary, from_version):
                  announcement = dict(manifest)
                  entry = dict(manifest["platforms"][platform], url=f"{base}/{binary}")
                  announcement["platforms"] = {platform: entry, f"{platform}-appimage": entry}
                  (mirror / "latest.json").write_text(json.dumps(announcement), encoding="utf-8")
                  subprocess.run(
                      ["./updater-probe/updater_smoke", mode, f"{base}/latest.json",
                       from_version, manifest["version"], str(profile)],
                      check=True, timeout=180,
                  )

              try:
                  probe("verify", current, "baseline.AppImage", "0.0.0")
                  baseline = digest(installed)
                  probe("reject", candidate, "tampered.AppImage", current["version"])
                  assert digest(installed) == baseline, "Failed update touched the previous installation"
                  probe("install", candidate, "candidate.AppImage", current["version"])
                  assert digest(installed) == digest(assets / asset), "Installed bytes differ from the candidate"
                  print(f"Installed SHA-256: {digest(installed)}")
              finally:
                  server.shutdown()
                  thread.join()
          PY
          xvfb-run -a bash -c '
            set -euo pipefail
            export TFL_DATA_DIR="$SMOKE_ROOT/profile"
            export APPIMAGE_EXTRACT_AND_RUN=1
            "$SMOKE_ROOT/profile/installed.AppImage" > release-evidence/launcher.txt 2>&1 &
            launcher=$!
            trap "kill $launcher 2>/dev/null || true" EXIT
            for attempt in {1..45}; do
              if xdotool search --onlyvisible --name "^TFL Client$" >/dev/null 2>&1; then
                echo "Updated launcher window opened" | tee -a release-evidence/updater.txt
                exit 0
              fi
              kill -0 "$launcher"
              sleep 1
            done
            echo "::error::Updated AppImage did not show the launcher window"
            exit 1
          '
      - name: Measure native launcher idle before and after
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tfl-updater-smoke"
          xvfb-run -a python3 tests/native/idle_appimage.py \
            "$root/mirror/baseline.AppImage" "$root/profile/installed.AppImage" |
            tee release-evidence/linux-idle.json
      - name: Upload native updater evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-updater-evidence
          path: release-evidence/
          if-no-files-found: warn
      - name: Upload and verify the draft without publishing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=450771853
          gh api "repos/$REPO/releases/$id" | jq -e --arg tag "$RELEASE_TAG" '.draft and .tag_name == $tag' > /dev/null
          gh api "repos/$REPO/releases/$id/assets?per_page=100" > existing-assets.json
          for file in release-assets/*; do
            name="${file##*/}"
            digest="$(sha256sum "$file" | cut -d " " -f 1)"
            existing="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest' existing-assets.json)"
            if [[ -n "$existing" ]]; then
              test "$existing" = "sha256:$digest"
              continue
            fi
            encoded="$(jq -rn --arg name "$name" '$name|@uri')"
            curl --silent --show-error --fail-with-body -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$file" "https://uploads.github.com/repos/$REPO/releases/$id/assets?name=$encoded" > /dev/null
          done
          test "$(gh api "repos/$REPO/releases/$id" --jq '.draft')" = true
          gh api "repos/$REPO/releases/$id/assets?per_page=100" > draft-assets.json
          python3 <<'PY'
          import hashlib
          import json
          from pathlib import Path

          draft = json.loads(Path("draft-assets.json").read_text(encoding="utf-8"))
          expected = {}
          for entry in Path("release-assets").iterdir():
              with entry.open("rb") as data:
                  expected[entry.name] = "sha256:" + hashlib.file_digest(data, "sha256").hexdigest()
          uploaded = {entry["name"]: entry.get("digest") for entry in draft}
          if expected != uploaded:
              raise ValueError("Draft assets differ from the verified packages")
          PY
          {
            echo "Stable draft staged and verified against the GitHub asset digests."
            echo "Linux signed upgrade and tamper rejection passed. Review the remaining acceptance evidence before promotion."
          } >> "$GITHUB_STEP_SUMMARY"
