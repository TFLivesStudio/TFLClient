name: Build TFL Client

# Cómo actualizar los pins de acciones (todas están fijadas a un commit SHA
# completo, con la versión como comentario, para que un tag movido o
# comprometido en el repo de la acción no pueda inyectar código en el build):
#   1. Mirar la versión nueva:   gh api repos/<dueño>/<repo>/releases --jq '.[].tag_name' | head
#   2. Resolver el SHA:          gh api repos/<dueño>/<repo>/git/ref/tags/<tag>
#      Si `object.type` es "tag" (tag anotado), desreferenciar:
#                                gh api repos/<dueño>/<repo>/git/tags/<object.sha> --jq .object.sha
#   3. Reemplazar SHA y comentario `# vX.Y.Z` en TODOS los workflows y en
#      .github/actions/ (buscar con: grep -rn "<dueño>/<repo>@" .github).
#   4. Probar con un workflow_dispatch (no publica Release) antes de cortar tag.
# Pins actuales: actions/checkout v4.4.0, actions/upload-artifact v4.6.2,
# Swatinem/rust-cache v2.9.2, dtolnay/rust-toolchain (master 2026-10-01),
# oven-sh/setup-bun v2.2.0, tauri-apps/tauri-action v0.6.2 (action-v0.6.2),
# taiki-e/install-action v2.87.26, actions/download-artifact v4.3.0.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Mínimo por defecto; cada job declara el suyo. El Release lo crea tauri-action
# con RELEASE_TOKEN (un PAT), no con el GITHUB_TOKEN del workflow, así que ningún
# job necesita permisos de escritura.
permissions:
  contents: read

# Dos builds del mismo tag/rama no corren en paralelo (pisarían el mismo
# Release). El segundo espera; no se cancela uno en curso a mitad de publicar.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Compuertas de calidad (frontend + rust + audit). Sin secrets a propósito.
  quality:
    name: Calidad
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    permissions:
      contents: read
    # Environment "release": GitHub lo crea solo la primera vez. El dueño del
    # repo puede moverle los secrets y exigir revisores (ver
    # docs/RELEASE_SECURITY.md). Mientras no haya reglas, no cambia nada.
    environment: release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Antes de compilar nada: la versión de package.json, tauri.conf.json,
      # src-tauri/Cargo.toml y Cargo.lock tiene que ser una sola, y en un tag
      # vX.Y.Z tiene que coincidir con el tag. Si no, el updater publicaría
      # metadatos de una versión distinta a la del instalador. En un
      # workflow_dispatch (build de prueba) solo avisa.
      - name: Verificar versión (archivos y tag)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/release-version.mjs --check --tag "$GITHUB_REF_NAME"
          else
            node scripts/release-version.mjs --check || echo "::warning::Las versiones de los archivos no coinciden (build de prueba, no bloquea)."
          fi

      - name: Instalar dependencias de sistema (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            xdg-utils

      # Rust exacto de rust-toolchain.toml (igual que el job de calidad) + cache.
      - name: Instalar Rust (versión fijada) y cache
        uses: ./.github/actions/setup-rust

      - name: Instalar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Instalar dependencias del frontend
        run: bun install --frozen-lockfile

      # Para las betas, publica docs/releases/<tag>.md cuando existe. El job
      # stable-draft prepara las notas de una estable después de toda la matriz.
      # Conserva las notas breves
      # in-app como alternativa compatible. Guía: docs/maintainers/release-notes.md.
      - name: Generar notas del Release (Markdown revisado o notas in-app)
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(bun run scripts/release-notes-body.mjs "$GITHUB_REF_NAME")"
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$BODY"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Firma/notarización de macOS: PLOMERÍA PREPARADA, sin efecto hoy.
      # Tauri lee APPLE_* con var_os(): un secret inexistente llega como cadena
      # VACÍA, y una cadena vacía cuenta como "definida" (intentaría importar un
      # certificado vacío, y APPLE_SIGNING_IDENTITY="" pisaría la firma ad-hoc "-"
      # de tauri.conf.json). Por eso este paso exporta cada variable a
      # $GITHUB_ENV SOLO si el secret tiene contenido. Mientras no se carguen los
      # secrets, no exporta nada y el build macOS queda exactamente como hoy.
      # Ver "macOS: firma y notarización" en docs/RELEASE_SECURITY.md.
      - name: Configurar firma de macOS (solo si hay credenciales)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          exported=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="$(printenv "IN_$name" || true)"
            if [ -n "$value" ]; then
              delim="EOF_$(uuidgen)"
              {
                echo "$name<<$delim"
                echo "$value"
                echo "$delim"
              } >> "$GITHUB_ENV"
              exported=$((exported + 1))
            fi
          done
          if [ "$exported" -eq 0 ]; then
            echo "Sin credenciales de Apple: se mantiene la firma ad-hoc de tauri.conf.json."
          else
            echo "Se exportaron $exported variable(s) de firma de Apple."
          fi

      - name: Build packaged MCP helper
        run: bun scripts/build-mcp-sidecar.mjs

      - name: Build + bundle (Tauri)
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2 (action-v0.6.2)
        env:
          # El GITHUB_TOKEN default de Actions es solo-lectura acá (política
          # de la org) — no puede crear Releases. RELEASE_TOKEN es un PAT
          # propio (scope Contents:RW, solo este repo) guardado como secret
          # justo para esto.
          GITHUB_TOKEN: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') && secrets.RELEASE_TOKEN || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Las betas se publican como antes. Un tag estable construye y firma
          # una sola vez; stable-draft reúne los paquetes verificados.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') && format('TFL Client {0}', github.ref_name) || '' }}
          # Un tag con guion (v0.11.0-beta.1) es una BETA: se publica como
          # prerelease, que GitHub NO cuenta como "latest". Eso es lo que evita
          # que quien no activó las betas en Ajustes la reciba (el updater estable
          # lee releases/latest/download/latest.json). Ver docs/CANAL_BETA.md.
          releaseBody: ${{ steps.notes.outputs.body || '' }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: --config src-tauri/tauri.mcp.conf.json ${{ matrix.args }}

      # Cinturón y tirantes: si por lo que sea el Release de una beta no quedó
      # marcado como prerelease, las actualizaciones estables se la ofrecerían a
      # todos. Este paso lo fuerza (y no toca los releases estables).
      - name: Asegurar que las betas sean prerelease
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        shell: bash
        run: gh release edit "$REF_NAME" --prerelease -R "$REPO"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      - name: Subir copia con nombre fijo (link de descarga directa)
        # Los archivos que sube tauri-action llevan la versión en el
        # nombre (ej. tflclient_0.9.11_x64-setup.exe) — cambia en cada
        # release, así que un link fijo en el README se rompería. Esta
        # copia usa siempre el mismo nombre, así el link de "descarga
        # directa" nunca hay que tocarlo a mano. Solo corre en release
        # real (tag), no en workflow_dispatch de prueba.
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        shell: bash
        run: |
          set -e
          if [ "$PLATFORM" = "macos-latest" ]; then
            cp "$(find target/release/bundle/dmg -name '*.dmg' | head -1)" TFLClient-macOS.dmg
            gh release upload "$REF_NAME" TFLClient-macOS.dmg --clobber -R "$REPO"
          elif [ "$PLATFORM" = "windows-latest" ]; then
            cp "$(find target/release/bundle/nsis -name '*.exe' | head -1)" TFLClient-Windows-Setup.exe
            gh release upload "$REF_NAME" TFLClient-Windows-Setup.exe --clobber -R "$REPO"
          else
            # Nombres fijos para las tres variantes — install-linux.sh
            # (ver ese script) elige la que corresponda según el sistema,
            # sin depender del número de versión en el nombre real.
            cp "$(find target/release/bundle/appimage -name '*.AppImage' | head -1)" TFLClient-Linux.AppImage
            cp "$(find target/release/bundle/deb -name '*.deb' | head -1)" TFLClient-Linux.deb
            cp "$(find target/release/bundle/rpm -name '*.rpm' | head -1)" TFLClient-Linux.rpm
            gh release upload "$REF_NAME" TFLClient-Linux.AppImage TFLClient-Linux.deb TFLClient-Linux.rpm --clobber -R "$REPO"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      - name: Subir instaladores como artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tflclient-${{ matrix.platform }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app.tar.gz
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: warn

      - name: Verify Windows installer in an isolated directory
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'tfl-install-smoke'
          $install = Start-Process -FilePath $files[0].FullName -ArgumentList "/S /D=$destination" -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS exited with $($install.ExitCode)" }
          $installed = Get-Item (Join-Path $destination 'tflclient.exe')
          $installed | Format-List Name, Length, VersionInfo
          $expected = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($installed.VersionInfo.ProductVersion -ne $expected) {
            throw "Installed product version differs from $expected"
          }
          Get-AuthenticodeSignature -FilePath $files[0].FullName | Format-List Status, StatusMessage

      - name: Verify macOS disk image and app code signature
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          images=(target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1 && test -s "${images[0]}"
          mount="$RUNNER_TEMP/tfl-dmg-smoke"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${images[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          apps=("$mount"/*.app)
          test "${#apps[@]}" -eq 1 && test -d "${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "${apps[0]}/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"

      - name: Verify Linux packages
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage=("$PWD"/target/release/bundle/appimage/*.AppImage)
          deb=(target/release/bundle/deb/*.deb)
          rpm=(target/release/bundle/rpm/*.rpm)
          version="${GITHUB_REF_NAME#v}"
          test "${#appimage[@]}" -eq 1 && test -s "${appimage[0]}"
          test "${#deb[@]}" -eq 1 && test -s "${deb[0]}"
          test "${#rpm[@]}" -eq 1 && test -s "${rpm[0]}"
          test "$(dpkg-deb --field "${deb[0]}" Version)" = "$version"
          dpkg-deb --contents "${deb[0]}" > "$RUNNER_TEMP/tfl-deb-files.txt"
          grep -E '/usr/bin/tflclient$' "$RUNNER_TEMP/tfl-deb-files.txt"
          sudo apt-get install -y rpm
          test "$(rpm -qp --queryformat '%{VERSION}' "${rpm[0]}")" = "$version"
          rpm -qpl "${rpm[0]}" > "$RUNNER_TEMP/tfl-rpm-files.txt"
          grep -Fx '/usr/bin/tflclient' "$RUNNER_TEMP/tfl-rpm-files.txt"
          mkdir "$RUNNER_TEMP/tfl-appimage-smoke"
          cd "$RUNNER_TEMP/tfl-appimage-smoke"
          "${appimage[0]}" --appimage-extract > extract.log
          test -x squashfs-root/AppRun

      - name: Stage signed stable packages
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir stable-packages
          find target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.app.tar.gz' -o -name '*.dmg' -o -name '*-setup.exe' -o -name '*.sig' \) \
            -exec sh -c 'cp "$@" stable-packages/' sh '{}' +
      - name: Upload signed stable packages
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-${{ matrix.platform }}
          path: stable-packages/
          if-no-files-found: error

  stable-draft:
    name: Verify and stage stable release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stable-*
          path: stable-matrix
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-updater-probe
          path: updater-probe
      - name: Install signature verifier and native smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xauth xdotool
      - name: Verify updater signatures and generate a complete release manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-version.mjs --check --tag "$GITHUB_REF_NAME"
          node scripts/release-notes-body.mjs "$GITHUB_REF_NAME" > release-notes.md
          mkdir release-assets
          python3 <<'PY'
          import base64
          import datetime
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          matrix = Path("stable-matrix")
          assets = Path("release-assets")
          tag = os.environ["GITHUB_REF_NAME"]
          repository = os.environ["GITHUB_REPOSITORY"]
          config = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          public_key = Path("updater.pub")
          public_key.write_bytes(base64.b64decode(config["plugins"]["updater"]["pubkey"], validate=True))
          platforms = {}

          def unique(platform, pattern):
              candidates = list((matrix / ("stable-" + platform)).glob(pattern))
              if len(candidates) != 1 or candidates[0].stat().st_size == 0:
                  raise ValueError(f"{platform} must contain exactly one nonempty {pattern}")
              return candidates[0]

          def keep(source, alias=None):
              destination = assets / (alias or source.name)
              if destination.exists():
                  raise ValueError(f"Duplicate release asset {destination.name}")
              shutil.copyfile(source, destination)

          windows = unique("windows-latest", "*-setup.exe")
          macos = unique("macos-latest", "*.app.tar.gz")
          linux = unique("ubuntu-22.04", "*.AppImage")
          dmg = unique("macos-latest", "*.dmg")
          deb = unique("ubuntu-22.04", "*.deb")
          rpm = unique("ubuntu-22.04", "*.rpm")

          for source, alias in [
              (windows, "TFLClient-Windows-Setup.exe"), (dmg, "TFLClient-macOS.dmg"),
              (linux, "TFLClient-Linux.AppImage"), (deb, "TFLClient-Linux.deb"),
              (rpm, "TFLClient-Linux.rpm"),
          ]:
              keep(source, alias)
          updater_targets = {
              windows: ("windows-x86_64", "nsis", True),
              macos: ("darwin-aarch64", "app", True),
              linux: ("linux-x86_64", "appimage", True),
              deb: ("linux-x86_64", "deb", False),
              rpm: ("linux-x86_64", "rpm", False),
          }
          for source in (*updater_targets, dmg):
              keep(source)
              signature = source.with_name(source.name + ".sig")
              if source in updater_targets or signature.is_file():
                  encoded = signature.read_text(encoding="utf-8").strip()
                  decoded = Path("updater.minisig")
                  decoded.write_bytes(base64.b64decode(encoded, validate=True))
                  subprocess.run(["minisign", "-Vm", str(source), "-p", str(public_key),
                                  "-x", str(decoded)], check=True)
                  keep(signature)
                  if source in updater_targets:
                      platform, bundle, default = updater_targets[source]
                      entry = {"signature": encoded, "url": (
                          f"https://github.com/{repository}/releases/download/{quote(tag)}/{quote(source.name)}"
                      )}
                      platforms[f"{platform}-{bundle}"] = entry
                      if default:
                          platforms[platform] = entry

          manifest = {
              "version": tag.removeprefix("v"),
              "notes": Path("release-notes.md").read_text(encoding="utf-8").strip(),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": platforms,
          }
          Path("release-assets/latest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          (cd release-assets && sha256sum -- * > SHA256SUMS)
      - name: Upgrade a published AppImage with the native Tauri updater
        shell: bash
        run: |
          set -euo pipefail
          export SMOKE_ROOT="$RUNNER_TEMP/tfl-updater-smoke"
          mkdir -p "$SMOKE_ROOT/mirror" "$SMOKE_ROOT/profile" release-evidence
          chmod +x updater-probe/updater_smoke
          touch "$SMOKE_ROOT/profile/TEST_PROFILE"
          release_base="https://github.com/$GITHUB_REPOSITORY/releases"
          baseline_manifest="$release_base/latest/download/latest.json"
          if [[ "$GITHUB_REF_NAME" == v0.15.4 ]]; then
            baseline_manifest="$release_base/download/v0.15.4-beta.3/latest.json"
          fi
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            "$baseline_manifest" -o "$SMOKE_ROOT/baseline.json"
          baseline_url="$(jq -er '.platforms["linux-x86_64"].url' "$SMOKE_ROOT/baseline.json")"
          [[ "$baseline_url" == "$release_base/download/"*".AppImage" ]]
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            "$baseline_url" -o "$SMOKE_ROOT/mirror/baseline.AppImage"
          cp "$SMOKE_ROOT/mirror/baseline.AppImage" "$SMOKE_ROOT/profile/installed.AppImage"
          chmod +x "$SMOKE_ROOT/profile/installed.AppImage"
          xvfb-run -a python3 -u - <<'PY' | tee release-evidence/updater.txt
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from threading import Thread
          from urllib.parse import unquote, urlsplit
          import hashlib
          import json
          import os
          import shutil
          import subprocess

          root = Path(os.environ["SMOKE_ROOT"])
          profile = root / "profile"
          mirror = root / "mirror"
          installed = profile / "installed.AppImage"
          assets = Path("release-assets")
          current = json.loads((root / "baseline.json").read_text(encoding="utf-8"))
          candidate = json.loads((assets / "latest.json").read_text(encoding="utf-8"))
          platform = "linux-x86_64"
          asset = unquote(urlsplit(candidate["platforms"][platform]["url"]).path.rsplit("/", 1)[-1])
          shutil.copyfile(assets / asset, mirror / "candidate.AppImage")
          shutil.copyfile(assets / asset, mirror / "tampered.AppImage")
          with (mirror / "tampered.AppImage").open("ab") as modified:
              modified.write(b"modified by the smoke test\n")

          def digest(path):
              with path.open("rb") as data:
                  return hashlib.file_digest(data, "sha256").hexdigest()

          handler = partial(SimpleHTTPRequestHandler, directory=mirror)
          with ThreadingHTTPServer(("127.0.0.1", 0), handler) as server:
              thread = Thread(target=server.serve_forever, daemon=True)
              thread.start()
              base = f"http://127.0.0.1:{server.server_port}"

              def probe(mode, manifest, binary, from_version):
                  announcement = dict(manifest)
                  entry = dict(manifest["platforms"][platform], url=f"{base}/{binary}")
                  announcement["platforms"] = {platform: entry, f"{platform}-appimage": entry}
                  (mirror / "latest.json").write_text(json.dumps(announcement), encoding="utf-8")
                  subprocess.run(
                      ["./updater-probe/updater_smoke", mode, f"{base}/latest.json",
                       from_version, manifest["version"], str(profile)],
                      check=True, timeout=180,
                  )

              try:
                  probe("verify", current, "baseline.AppImage", "0.0.0")
                  baseline = digest(installed)
                  probe("reject", candidate, "tampered.AppImage", current["version"])
                  assert digest(installed) == baseline, "Failed update touched the previous installation"
                  probe("install", candidate, "candidate.AppImage", current["version"])
                  assert digest(installed) == digest(assets / asset), "Installed bytes differ from the candidate"
                  print(f"Installed SHA-256: {digest(installed)}")
              finally:
                  server.shutdown()
                  thread.join()
          PY
          xvfb-run -a bash -c '
            set -euo pipefail
            export TFL_DATA_DIR="$SMOKE_ROOT/profile"
            export APPIMAGE_EXTRACT_AND_RUN=1
            "$SMOKE_ROOT/profile/installed.AppImage" > release-evidence/launcher.txt 2>&1 &
            launcher=$!
            trap "kill $launcher 2>/dev/null || true" EXIT
            for attempt in {1..45}; do
              if xdotool search --onlyvisible --name "^TFL Client$" >/dev/null 2>&1; then
                echo "Updated launcher window opened" | tee -a release-evidence/updater.txt
                exit 0
              fi
              kill -0 "$launcher"
              sleep 1
            done
            echo "::error::Updated AppImage did not show the launcher window"
            exit 1
          '
      - name: Measure native launcher idle before and after
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tfl-updater-smoke"
          xvfb-run -a python3 tests/native/idle_appimage.py \
            "$root/mirror/baseline.AppImage" "$root/profile/installed.AppImage" |
            tee release-evidence/linux-idle.json
      - name: Upload native updater evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-updater-evidence
          path: release-evidence/
          if-no-files-found: warn
      - name: Upload and verify the draft without publishing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id() {
            gh api --paginate "repos/$REPO/releases?per_page=100" |
              jq -sr --arg tag "$GITHUB_REF_NAME" '.[][] | select(.tag_name == $tag) | .id'
          }
          id="$(release_id)"
          if [[ -z "$id" ]]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "TFL Client $GITHUB_REF_NAME" --notes-file release-notes.md -R "$REPO"
            id="$(release_id)"
          fi
          [[ "$id" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$REPO/releases/$id" --jq '.draft')" = true
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber -R "$REPO"
          test "$(gh api "repos/$REPO/releases/$id" --jq '.draft')" = true
          gh api "repos/$REPO/releases/$id/assets?per_page=100" > draft-assets.json
          python3 <<'PY'
          import hashlib
          import json
          from pathlib import Path

          draft = json.loads(Path("draft-assets.json").read_text(encoding="utf-8"))
          expected = {}
          for entry in Path("release-assets").iterdir():
              with entry.open("rb") as data:
                  expected[entry.name] = "sha256:" + hashlib.file_digest(data, "sha256").hexdigest()
          uploaded = {entry["name"]: entry.get("digest") for entry in draft}
          if expected != uploaded:
              raise ValueError("Draft assets differ from the verified packages")
          PY
          {
            echo "Stable draft staged and verified against the GitHub asset digests."
            echo "Linux signed upgrade and tamper rejection passed. Review the remaining acceptance evidence before promotion."
          } >> "$GITHUB_STEP_SUMMARY"
