name: Build TFL Client

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de sistema (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            xdg-utils

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias del frontend
        run: bun install

      - name: Build + bundle (Tauri)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # El GITHUB_TOKEN default de Actions es solo-lectura acá (política
          # de la org) — no puede crear Releases. RELEASE_TOKEN es un PAT
          # propio (scope Contents:RW, solo este repo) guardado como secret
          # justo para esto.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Solo crea/actualiza un Release real cuando el disparador es un
          # tag "vX.Y.Z" — un workflow_dispatch manual (lo que uso para
          # pasarte builds de prueba) sigue sin tocar Releases, solo sube
          # los artifacts de siempre.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('TFL Client {0}', github.ref_name) || '' }}
          releaseBody: 'Ver el changelog del repo para el detalle de esta versión.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Subir instaladores como artifact
        uses: actions/upload-artifact@v4
        with:
          name: tflclient-${{ matrix.platform }}
          path: |
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app.tar.gz
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: warn
