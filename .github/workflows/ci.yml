name: CI

# Compuertas de calidad. Se ejecuta en push a main y en cada PR, y además lo
# reutiliza el workflow de release (build.yml) como prerequisito vía
# `workflow_call`: si algo de acá falla, NO se construye ni publica nada.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Para actualizar un pin de acción a otra versión: ver el comentario al inicio
# de build.yml ("Cómo actualizar los pins").

jobs:
  frontend:
    name: Frontend (check + lint)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      # --frozen-lockfile: falla si bun.lock no está al día con package.json.
      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: svelte-check
        run: bun run check

      - name: Unit behavior tests
        run: node --test tests/unit/*.test.mjs

      - name: Prettier + ESLint
        run: bun run lint

      - name: Visual policy tests
        run: bun test tests/unit

      # Solo informativo: hoy hay avisos en dependencias de desarrollo
      # (devalue, brace-expansion, ...) que no se envían en la app. No bloquea.
      - name: bun audit (informativo, no bloquea)
        continue-on-error: true
        run: bun audit

  rust:
    name: Rust (fmt + clippy + tests + audit)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Mismas dependencias de sistema que build.yml para Linux.
      - name: Instalar dependencias de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            xvfb \
            xdg-utils

      # Rust exacto de rust-toolchain.toml + cache.
      - uses: ./.github/actions/setup-rust

      # tauri::generate_context!() espera que exista el directorio del
      # frontend (`frontendDist`, ../build). En perfil dev no embebe nada, pero
      # crear un directorio vacío es gratis y evita un fallo de compilación si
      # eso cambia. El build real de release sí construye el frontend.
      - name: Crear directorio de frontend vacío (para generate_context!)
        run: mkdir -p build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # OJO: sin `-D warnings` a propósito. Hay ~20 warnings de clippy
      # preexistentes (0 errores); bloquear por ellos frenaría todos los
      # releases. Cuando se limpien, agregar `-- -D warnings` acá.
      # --locked: falla si Cargo.lock no está al día con los Cargo.toml.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked

      # Solo tests de librería (rápidos), no los de integración.
      - name: cargo test
        run: cargo test --workspace --lib --locked

      - name: Round-trip official Paper through server export and import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tfl-paper/profile" artifacts/native-paper
          touch "$RUNNER_TEMP/tfl-paper/profile/TEST_PROFILE"
          export TFL_DATA_DIR="$RUNNER_TEMP/tfl-paper/profile"
          export TFL_PAPER_TEST_JAR="$RUNNER_TEMP/tfl-paper/paper.jar"
          export TFL_PAPER_TEST_SHA256=5ee4f542f628a14c644410b08c94ea42e772ef4d29fe92973636b6813d4eaffc
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            --user-agent "TFLClient-Acceptance/0.15.4 (https://github.com/TFLivesStudio/TFLClient)" \
            "https://fill-data.papermc.io/v1/objects/$TFL_PAPER_TEST_SHA256/paper-1.21.4-232.jar" \
            --output "$TFL_PAPER_TEST_JAR"
          printf '%s  %s\n' "$TFL_PAPER_TEST_SHA256" "$TFL_PAPER_TEST_JAR" | sha256sum --check
          cargo test --locked -p tflclient --lib \
            commands::import_sources::tests::official_paper_export_import_preserves_jar_and_auth_policy \
            -- --exact --ignored --nocapture --test-threads=1 2>&1 | tee artifacts/native-paper/results.txt
      - name: Upload Paper round-trip evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-native-round-trip
          path: artifacts/native-paper/
          if-no-files-found: warn

      - name: Build native updater probe
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: cargo build --locked -p tflclient --example updater_smoke
      - name: Upload native updater probe
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-updater-probe
          path: target/debug/examples/updater_smoke
          if-no-files-found: error

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Native MCP stdio acceptance (isolated profile)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mcp-sdk" "$RUNNER_TEMP/mcp-profile"
          echo '{"private":true}' > "$RUNNER_TEMP/mcp-sdk/package.json"
          (cd "$RUNNER_TEMP/mcp-sdk" && bun add --exact @modelcontextprotocol/sdk@1.29.0)
          touch "$RUNNER_TEMP/mcp-profile/TEST_PROFILE"
          export TFL_DATA_DIR="$RUNNER_TEMP/mcp-profile"
          export MCP_SDK_ROOT="$RUNNER_TEMP/mcp-sdk/node_modules/@modelcontextprotocol/sdk/dist/esm"
          export MCP_BINARY="$GITHUB_WORKSPACE/target/debug/tflclient-mcp"
          cargo build --locked -p tflclient --example mcp_host --features mcp-integration-tests
          cargo build --locked -p tfl-mcp --bin tflclient-mcp
          xvfb-run -a target/debug/examples/mcp_host > /tmp/tfl-mcp-host.log 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if [ -f "$TFL_DATA_DIR/status.json" ]; then break; fi
            sleep 1
          done
          node tests/mcp/client.mjs
          mkdir -p artifacts/mcp
          cp "$TFL_DATA_DIR/acceptance.json" artifacts/mcp/
      - name: Upload native MCP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-native-acceptance
          path: artifacts/mcp/
          if-no-files-found: warn

      # cargo-audit instalado como binario precompilado con checksum, versión
      # fija. Las excepciones (todas "unmaintained"/"unsound" transitivas) están
      # justificadas una por una en .cargo/audit.toml.
      - name: Instalar cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit
        run: cargo audit

  native-platform:
    name: Native acceptance (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Run native feature tests with an isolated profile
        shell: bash
        env:
          TFL_NATIVE_NETWORK_TEST_URL: https://raw.githubusercontent.com/TFLivesStudio/TFLClient/fb23b9df3164bb95d65e157554f7e4c67a68a7c0/README.md
        run: |
          set -euo pipefail
          mkdir -p build artifacts/native "$RUNNER_TEMP/tfl-native"
          export TFL_DATA_DIR="$RUNNER_TEMP/tfl-native/profile"
          mkdir -p "$TFL_DATA_DIR"
          touch "$TFL_DATA_DIR/TEST_PROFILE"
          if [[ "$RUNNER_OS" == Windows ]]; then
            export TFL_DATA_DIR="$(cygpath -w "$TFL_DATA_DIR")"
          fi
          cargo_json="$RUNNER_TEMP/tfl-native/cargo.jsonl"
          if ! cargo test --locked -p tflclient --lib --no-run --message-format=json > "$cargo_json"; then
            jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' \
              "$cargo_json" | tee artifacts/native/compile-errors.txt
            exit 1
          fi
          executable="$(jq -rs '[.[] | select(.reason == "compiler-artifact" and .profile.test and .executable != null)] | last | .executable // empty' "$cargo_json")"
          test -n "$executable"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Cargo's libtest binary does not inherit the app's activation
            # context. WebView2 needs TaskDialogIndirect from Common Controls 6.
            cat > "$executable.manifest" <<'MANIFEST'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          MANIFEST
          fi
          "$executable" --list > artifacts/native/tests.txt
          grep -Eq '^services::worlds::.*: test$' artifacts/native/tests.txt
          grep -Eq '^services::mcp_quick_connect::.*: test$' artifacts/native/tests.txt
          grep -Eq '^commands::instance::console_metrics::.*: test$' artifacts/native/tests.txt
          "$executable" --nocapture --test-threads=1 \
            services::worlds:: services::world_backup:: services::server_ports:: \
            services::server_tasks:: services::instance_archive:: services::settings_manager:: \
            services::mcp_quick_connect:: commands::import_sources:: commands::settings:: \
            commands::instance::console_metrics:: commands::instance::tests:: commands::system_status:: \
            2>&1 | tee artifacts/native/results.txt
          TFL_SETTINGS_ACCEPTANCE=1 "$executable" --ignored --exact \
            services::settings_manager::tests::patches_reject_stale_windows_invalid_values_and_failed_commits \
            --nocapture --test-threads=1 2>&1 | tee artifacts/native/settings-patches.txt
          "$executable" --ignored --exact services::maintenance::tests::installation_and_new_operations_exclude_each_other \
            --nocapture 2>&1 | tee artifacts/native/maintenance.txt
      - name: Upload native feature evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-acceptance-${{ matrix.platform }}
          path: artifacts/native/
          if-no-files-found: warn

  visual:
    name: UI regression (Chromium)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Build frontend and check release metadata
        run: |
          bun install --frozen-lockfile
          bun run release:version --check
          bun run build
      - name: Install isolated browser test tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tfl-browser"
          cd "$RUNNER_TEMP/tfl-browser"
          echo '{"private":true}' > package.json
          bun add --exact playwright@1.57.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify UI against production build (simulated IPC)
        shell: bash
        env:
          VISUAL_URL: http://localhost:1423
          VISUAL_OUTPUT: artifacts/beta2/regression
        run: |
          set -euo pipefail
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/tfl-browser/node_modules/playwright/index.mjs"
          bun run preview -- --host 0.0.0.0 --port 1423 > /tmp/tfl-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..40}; do
            if curl -fsS "$VISUAL_URL" > /dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS "$VISUAL_URL" > /dev/null; then
            cat /tmp/tfl-preview.log
            exit 1
          fi
          mkdir -p artifacts/visual-refresh
          status=0
          results=artifacts/visual-refresh/test-results.txt
          run_visual() {
            local name="$1"
            shift
            echo "::group::$name"
            if "$@"; then
              printf '%s PASS\n' "$name" | tee -a "$results"
            else
              status=1
              printf '%s FAIL\n' "$name" | tee -a "$results"
            fi
            echo "::endgroup::"
          }
          for suite in beta2 smoke workspaces lifecycle experience mcp-scenes auth pixel-controls \
            living-settings landscapes background-banners sidebar-refinement character-interaction \
            selection-experience beta3 addons scene-motion release-154-home release-154-settings \
            release-154-console release-154-character; do
            run_visual "$suite" node "tests/visual/$suite.mjs"
          done
          run_visual addons-pixel-theme \
            env ADDONS_UI_FULL_THEME=1 ADDONS_UI_CASE=pixel/dark,pixel/light \
            ADDONS_OUTPUT=artifacts/beta3-addon-full-theme node tests/visual/addons.mjs
          cat "$results"
          exit "$status"
      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beta-ui-review
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
