name: Build TFL MP Guard (mod)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mp-guard/**'
      - '.github/workflows/mp-guard.yml'

# Pins por SHA completo; cómo actualizarlos: ver el encabezado de build.yml.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Instalar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Gradle (versión compatible con fabric-loom 1.7.x)
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.10.2'
          build-root-directory: mp-guard

      - name: Compilar el mod
        working-directory: mp-guard
        run: gradle build --stacktrace

      - name: Subir jar como artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfl-mp-guard-1.21.1
          path: mp-guard/build/libs/*.jar
          if-no-files-found: error
