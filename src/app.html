<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TFL Client</title>
		<style>
			body {
				background: #0a0a0a;
				margin: 0;
			}
			/* Antes era style="display: contents" inline en el div: con una CSP
			   estricta un atributo style del HTML no se puede hashear, así que
			   va como clase en este bloque (que sí se hashea). */
			.app-root {
				display: contents;
			}
		</style>
		%sveltekit.head%
	</head>

	<body>
		<div class="app-root">%sveltekit.body%</div>
	</body>
</html>
