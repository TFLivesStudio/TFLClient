[package]
name = "tflclient"
version = "0.15.1"
description = "TFL Client, launcher de Minecraft de TFLives"
authors = ["TFLives"]
edition = "2024"

[lib]
name = "tflclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
mcp-integration-tests = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tfl-mcp = { path = "../crates/tfl-mcp" }
# Sin la feature "devtools": en builds de release no existe el inspector.
# En `tauri dev` (debug) Tauri lo habilita solo.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
aqua = { path = "../crates/aqua" }
launchwerk = { path = "../crates/launchwerk", features = ["auth"] }
directories = "6.0.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "net", "time", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
sysinfo = "0.30"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
futures = "0.3"
zip = "9"
toml = "1"
base64 = "0.22"
infer = "0.19"
sha1 = "0.11"
notify = "8"
dashmap = "6"
parking_lot = "0.12"
cubrinth = { path = "../crates/cubrinth" }
zellkern = { path = "../crates/zellkern" }
communicator = { path = "../crates/communicator" }
compact_str = { version = "0.9", features = ["serde"] }
smallvec = "1"
ablage = { path = "../crates/ablage" }
postcard = { version = "1", features = ["use-std"] }
urlencoding = "2"
url = "2"
semver = "1"
regex = "1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-clipboard-manager = "2.3.3"
igd-next = { version = "0.15", features = ["aio_tokio"] }
playit-agent-core = "0.20"
playit-api-client = "0.1"
rand = "0.9"
hex = "0.4"
# Solo para leer (nunca escribir) la base de datos SQLite de la app de
# Modrinth al detectar sus instancias para importar — ver import_launchers.rs.
# "bundled" para no depender de libsqlite3 del sistema en ninguna plataforma.
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
mslnk = "0.1.8"

[dev-dependencies]
# Runtime simulado para probar el ACL real de las capabilities (src/acl_tests.rs).
tauri = { version = "2", features = ["test"] }

[[example]]
name = "mcp_host"
required-features = ["mcp-integration-tests"]
