[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/tfl-mcp",
    "crates/aqua",
    "crates/launchwerk",
    "crates/communicator",
    "crates/cubrinth",
    "crates/zellkern",
    "crates/ablage",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug-assertions = false
overflow-checks = false

# Opt-in review artifacts. Official signed releases keep the release profile above.
[profile.review]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 8
incremental = false
